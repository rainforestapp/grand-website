<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stand-in portrait for the About page's founding team cards.

  Why an SVG rather than a stock photo: the real headshots have not been
  supplied yet, and a placeholder that is visibly a placeholder is safer than
  one that could be mistaken for a founder. Swapping in a real photo is a
  one-line `src` change per card; the 4:5 frame already matches.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500" role="img" aria-hidden="true">
  <rect width="400" height="500" fill="#eceee9"/>
  <circle cx="200" cy="208" r="66" fill="#d4d5d0"/>
  <path d="M78 500c0-67 55-122 122-122s122 55 122 122z" fill="#d4d5d0"/>
</svg>
